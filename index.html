<!DOCTYPE html>
<html>
<head>
  <title>such a comedian</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Special+Elite&display=swap');

    body {
      background-color: LemonChiffon;
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Special Elite", "Courier New", monospace;
      color: #ad4c6a;
    }

    .text-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      transform: rotate(-1deg); /* tiny off-kilter typewriter feel */
    }

    .name,
    .subtitle {
      font-family: "Special Elite", "Courier New", monospace;
      color: #ad4c6a;
      text-transform: lowercase;
      letter-spacing: 1px;
      line-height: 1.3;
      text-shadow: 1px 1px 0 rgba(0,0,0,0.08);
    }

    .name {
      font-size: 46px;
      font-weight: 400;
      margin: 0;
    }

    .subtitle {
      font-size: 24px;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="text-block">
    <div class="name">sean fairfield</div>
    <div class="subtitle">such a comedian &lt;3</div>
  </div>
</body>
</html>
