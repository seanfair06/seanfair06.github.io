<!DOCTYPE html>
<html>
<head>
  <title>My Website</title>
  <style>
    body {
      background-color: #f9dfe7;
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      color: #000000;
    }

    .name {
      font-family: "Arial Black", Arial, sans-serif;
      font-size: 18px;
      color: #000000;
      font-weight: 900;
      text-transform: lowercase;
      text-align: center;
      line-height: 1.2;
      margin: 0;
    }

    .subtitle {
      font-family: Cambria, Georgia, serif;
      font-size: 11px;
      color: #000000;
      text-transform: lowercase;
      text-align: center;
      margin-top: 6px;
      letter-spacing: 0.3px;
    }
  </style>
</head>
<body>
  <div class="name">sean fairfield</div>
  <div class="subtitle">such a comedian</div>
</body>
</html>
