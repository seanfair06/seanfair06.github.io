<!DOCTYPE html>
<html>
<head>
  <title>My Website</title>
  <style>
    body {
      background-color: #f9dfe7;
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      color: #000000;
    }

    .text-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .name {
      font-family: "Arial Black", Arial, sans-serif;
      font-size: 46px;
      color: #000000;
      font-weight: 900;
      text-transform: lowercase;
      line-height: 1.1;
      margin: 0;
      letter-spacing: 0.5px;
    }

    .subtitle {
      font-family: Cambria, Georgia, serif;
      font-size: 24px;
      color: #000000;
      text-transform: lowercase;
      margin-top: 10px;
      line-height: 1.2;
      letter-spacing: 0.2px;
    }
  </style>
</head>
<body>
  <div class="text-block">
    <div class="name">sean fairfield</div>
    <div class="subtitle">such a comedian <3</div>
  </div>
</body>
</html>
