<!DOCTYPE html>
<html>
<head>
  <title>such a comedian</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Special+Elite&display=swap');

    :root {
      --bg: LemonChiffon;
      --text: #ad4c6a;
      --button-pink: #ad4c6a;
      --custom-cursor: url('kbkdnjcr.png') 0 0, auto;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: "Special Elite", "Courier New", monospace;
      cursor: var(--custom-cursor);
    }

    body {
      min-height: 100vh;
    }

    .page-frame {
      min-height: 100vh;
      padding: 28px;
      border: 28px solid transparent;
      border-image: url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAFQAAABUCAYAAAAcaxDBAAACYElEQVR4AezZUU7rQAyF4dD18cYuWBC74I39gfzmnFHintgSVftfaaSZjG2qr2Z0J9w2+ff9/vnrDEnfnNyInc7XerqOn5mH7lfrnJERiZR1GFVZr7BohWzUxvywRbnCmE7dZLzJfwrVcSl7dZyqGsHc2zZXAAADm5lqDMQAAAB4L3K1HkQAAABUFUExQxZ2HwbjKwaz7gUQ+G8pr0Yu7t6OeHvepZum/9H/1YQeA+niJz7T4p9i4FYiLq0Erzjp1q7CEgjCr4vPaxdTtw0ESR6hp1TdGYTM9g33hLs6WgAABJRU5ErkJggg==") 30 round;
      background: var(--bg);
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .content {
      width: 100%;
      display: grid;
      place-items: center;
    }

    .text-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .name, .subtitle, .extra, .poem-link, .about-text {
      margin: 0;
      color: var(--text);
      text-transform: lowercase;
      letter-spacing: 1px;
      line-height: 1.3;
      font-family: "Special Elite", "Courier New", monospace;
    }

    .name {
      font-size: 46px;
      font-weight: 400;
    }

    .subtitle {
      margin-top: 10px;
      font-size: 24px;
    }

    .extra {
      margin-top: 12px;
      font-size: 18px;
    }

    .poem-link {
      margin-top: 34px;
      font-size: 24px;
      text-decoration: none;
      display: inline-block;
      color: var(--text);
      cursor: var(--custom-cursor);
    }

    .about-text {
      margin-top: 40px;
      font-size: 24px;
      display: inline-block;
      color: var(--text);
      cursor: var(--custom-cursor);
    }

    .poem-link:hover {
      opacity: 0.8;
      cursor: var(--custom-cursor);
    }

    .olivia-button-wrap {
      position: relative;
      display: inline-block;
      margin-top: 16px;
      cursor: var(--custom-cursor);
    }

    .olivia-button {
      display: block;
      width: 160px;
      height: 34px;
      background: var(--button-pink);
      border-radius: 999px;
      text-decoration: none;
      border: 2px solid var(--button-pink);
      box-shadow: 0 3px 0 rgba(0, 0, 0, 0.06);
      cursor: var(--custom-cursor);
    }

    .olivia-button-text {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-size: 0.68rem;
      font-family: "Special Elite", "Courier New", monospace;
      text-transform: lowercase;
      pointer-events: none;
      z-index: 2;
      cursor: var(--custom-cursor);
    }

    .olivia-button-wrap:hover .olivia-button {
      filter: brightness(1.04);
      cursor: var(--custom-cursor);
    }

    a, a:hover, a:visited, a:active {
      color: var(--text);
      text-decoration: none;
      cursor: var(--custom-cursor);
    }
  </style>
</head>
<body>
  <div class="page-frame">
    <div class="content">
      <div class="text-block">
        <div class="name">✧sean fairfield✧</div>
        <div class="subtitle">such a comedian &lt;3</div>
        <div class="extra">olivia tysm for teaching me</div>

        <div class="olivia-button-wrap">
          <a href="https://detectiveosprey.github.io" target="_blank" rel="noopener noreferrer" class="olivia-button"></a>
          <div class="olivia-button-text">olivia's website</div>
        </div>

        <a class="poem-link" href="poem.html">✧ode to microwave✧</a>
        <div class="about-text">✧about me✧</div>
      </div>
    </div>
  </div>
</body>
</html>
